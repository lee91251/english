<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>내 단어장</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1a1a; --muted:#6b7280;
    --line:#e5e7eb; --accent:#3b6cff; --accent2:#eef2ff;
    --good:#16a34a; --hard:#d97706; --again:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0aa;
      --line:#2b2f38; --accent:#5b82ff; --accent2:#1c2230;
      --good:#22c55e; --hard:#f59e0b; --again:#ef4444;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px;}
  h1{font-size:20px;margin:0;font-weight:700;}
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:20px;}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);
    padding:9px 0;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;}
  .tabs button.on{background:var(--accent);color:#fff;}
  .panel{display:none;}
  .panel.on{display:block;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600;}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:11px;color:var(--text);font-size:15px;font-family:inherit;}
  textarea{min-height:64px;resize:vertical;}
  .btn{display:inline-block;border:0;border-radius:10px;padding:12px 18px;
    font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;}
  .btn.wide{width:100%;margin-top:18px;}
  .btn.ghost{background:var(--accent2);color:var(--accent);}
  .small{font-size:13px;color:var(--muted);}
  /* 복습 */
  .due{text-align:center;font-size:14px;color:var(--muted);margin-bottom:14px;}
  .flash{min-height:150px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;gap:12px;padding:24px 12px;}
  .front{font-size:30px;font-weight:700;line-height:1.3;word-break:break-word;}
  .ctx{font-size:15px;color:var(--muted);font-style:italic;line-height:1.5;}
  .ctx b{color:var(--accent);font-style:normal;}
  .answer{font-size:22px;font-weight:600;color:var(--accent);}
  .rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;}
  .rate button{border:0;border-radius:10px;padding:14px 0;font-size:15px;
    font-weight:700;color:#fff;cursor:pointer;}
  .r-again{background:var(--again);} .r-hard{background:var(--hard);} .r-good{background:var(--good);}
  .toggle{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;font-size:13px;color:var(--muted);}
  .switch{position:relative;width:44px;height:24px;background:var(--line);border-radius:12px;cursor:pointer;transition:.2s;}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
    background:#fff;border-radius:50%;transition:.2s;}
  .switch.on::after{left:23px;}
  /* 목록 */
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:12px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row .en{font-weight:700;font-size:16px;}
  .row .kr{font-size:14px;color:var(--muted);}
  .row .ex{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic;}
  .del{background:transparent;border:0;color:var(--again);cursor:pointer;font-size:13px;flex-shrink:0;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;line-height:1.7;}
  .bkrow{display:flex;gap:8px;margin-top:12px;}
  .bkrow .btn{flex:1;}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px;}
  .done{text-align:center;padding:36px 0;}
  .done .big{font-size:40px;}
  .done .msg{font-size:16px;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="./" style="text-decoration:none;margin-right:6px" aria-label="back">&larr;</a>📒 내 단어장</h1>
    <span class="small" id="totalCount"></span>
  </header>

  <div class="tabs">
    <button data-tab="review" class="on">복습</button>
    <button data-tab="add">추가</button>
    <button data-tab="list">목록</button>
    <button data-tab="backup">백업</button>
  </div>

  <!-- 복습 -->
  <div class="panel on" id="review">
    <div class="toggle">
      영어→뜻
      <div class="switch" id="dirSwitch"></div>
      뜻→영어
    </div>
    <div class="due" id="dueInfo"></div>
    <div class="card" id="reviewCard"></div>
  </div>

  <!-- 추가 -->
  <div class="panel" id="add">
    <div class="card">
      <label>영어 단어 · 표현</label>
      <input id="inEn" placeholder="예: come up with">
      <label>뜻 (한국어)</label>
      <input id="inKr" placeholder="예: ~을 생각해내다, 떠올리다">
      <label>본 문장 (선택 — 이게 오래 기억됩니다)</label>
      <textarea id="inCtx" placeholder="예: She came up with a great idea."></textarea>
      <button class="btn wide" id="saveBtn">단어장에 저장</button>
      <p class="note">💡 앱·유튜브·기사에서 모르는 단어를 만나면 <b>문장째로</b> 붙여넣으세요. 하루 5개면 충분합니다.</p>
    </div>
  </div>

  <!-- 목록 -->
  <div class="panel" id="list">
    <div class="card" id="listCard"></div>
  </div>

  <!-- 백업 -->
  <div class="panel" id="backup">
    <div class="card">
      <p class="small"><b>단어장은 이 컴퓨터에만 저장됩니다.</b> 브라우저 데이터를 지우면 사라질 수 있으니, 가끔 <b>내보내기</b>로 파일 백업을 만드세요. 이게 유일하게 누적되는 자산입니다.</p>
      <div class="bkrow">
        <button class="btn" id="exportBtn">내보내기 (백업 파일 저장)</button>
        <button class="btn ghost" id="importBtn">불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <p class="note">불러오기를 하면 현재 단어에 <b>합쳐집니다</b> (같은 단어는 안 겹침).</p>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "vocab_cards_v1";
  var DIRKEY = "vocab_dir_v1";
  // 레벨별 다음 복습까지 일수
  var INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60, 120, 240];
  var DAY = 24*60*60*1000;

  var cards = load();
  var dir = localStorage.getItem(DIRKEY) === "kr"; // true = 뜻→영어
  var session = [];      // 이번 복습 세션 큐 (id 목록)
  var current = null;    // 현재 카드
  var revealed = false;
  var reviewedToday = 0;

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch(e){ return []; }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(cards)); refreshCounts(); }
  function now(){ return Date.now(); }
  function uid(){ return now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }

  function dueCards(){
    var t = now();
    return cards.filter(function(c){ return (c.due||0) <= t; });
  }
  function refreshCounts(){
    document.getElementById("totalCount").textContent = cards.length ? (cards.length + "개 단어") : "";
  }

  /* ---------- 탭 ---------- */
  var tabBtns = document.querySelectorAll(".tabs button");
  tabBtns.forEach(function(b){
    b.addEventListener("click", function(){
      tabBtns.forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("on"); });
      var tab = b.getAttribute("data-tab");
      document.getElementById(tab).classList.add("on");
      if (tab === "review") startReview();
      if (tab === "list") renderList();
    });
  });

  /* ---------- 추가 ---------- */
  document.getElementById("saveBtn").addEventListener("click", function(){
    var en = document.getElementById("inEn").value.trim();
    var kr = document.getElementById("inKr").value.trim();
    var ctx = document.getElementById("inCtx").value.trim();
    if (!en || !kr){ alert("영어와 뜻은 꼭 입력해 주세요."); return; }
    cards.push({ id:uid(), en:en, kr:kr, ctx:ctx, level:0, due:now(), created:now() });
    save();
    document.getElementById("inEn").value = "";
    document.getElementById("inKr").value = "";
    document.getElementById("inCtx").value = "";
    document.getElementById("inEn").focus();
    var btn = document.getElementById("saveBtn");
    btn.textContent = "저장됨 ✓";
    setTimeout(function(){ btn.textContent = "단어장에 저장"; }, 900);
  });

  /* ---------- 방향 토글 ---------- */
  var dirSwitch = document.getElementById("dirSwitch");
  if (dir) dirSwitch.classList.add("on");
  dirSwitch.addEventListener("click", function(){
    dir = !dir;
    dirSwitch.classList.toggle("on", dir);
    localStorage.setItem(DIRKEY, dir ? "kr" : "en");
    revealed = false;
    renderCard();
  });

  /* ---------- 복습 ---------- */
  function startReview(){
    reviewedToday = 0;
    session = dueCards().map(function(c){ return c.id; });
    // 살짝 섞기
    for (var i=session.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = session[i]; session[i]=session[j]; session[j]=t;
    }
    nextCard();
  }
  function nextCard(){
    revealed = false;
    if (session.length === 0){ current = null; renderCard(); return; }
    var id = session[0];
    current = cards.filter(function(c){ return c.id === id; })[0] || null;
    if (!current){ session.shift(); return nextCard(); }
    renderCard();
  }
  function highlightCtx(ctx, en){
    if (!ctx) return "";
    var safe = ctx.replace(/[&<>]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]; });
    try {
      var re = new RegExp("(" + en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig");
      safe = safe.replace(re, "<b>$1</b>");
    } catch(e){}
    return '<div class="ctx">' + safe + '</div>';
  }
  function renderCard(){
    var el = document.getElementById("reviewCard");
    var due = dueCards().length;
    var info = document.getElementById("dueInfo");

    if (cards.length === 0){
      info.textContent = "";
      el.innerHTML = '<div class="empty">아직 단어가 없어요.<br>위 <b>추가</b> 탭에서 첫 단어를 넣어보세요.</div>';
      return;
    }
    if (!current){
      info.textContent = "";
      el.innerHTML = '<div class="done"><div class="big">🎉</div>'
        + '<div class="msg">오늘 복습할 단어를 다 끝냈어요.</div>'
        + (reviewedToday ? '<p class="small">오늘 ' + reviewedToday + '개 복습함</p>' : '')
        + '<p class="small">새 단어를 더 추가하거나 내일 다시 오세요.</p></div>';
      return;
    }

    info.textContent = "복습할 단어 " + session.length + "개 남음";
    var frontText = dir ? current.kr : current.en;
    var backText  = dir ? current.en : current.kr;

    if (!revealed){
      el.innerHTML = '<div class="flash"><div class="front">' + esc(frontText) + '</div></div>'
        + '<button class="btn wide" id="showBtn">답 보기</button>';
      document.getElementById("showBtn").addEventListener("click", function(){
        revealed = true; renderCard();
      });
    } else {
      el.innerHTML = '<div class="flash">'
        + '<div class="front">' + esc(frontText) + '</div>'
        + '<div class="answer">' + esc(backText) + '</div>'
        + highlightCtx(current.ctx, current.en)
        + '</div>'
        + '<div class="rate">'
        + '<button class="r-again" data-r="again">모름</button>'
        + '<button class="r-hard" data-r="hard">애매</button>'
        + '<button class="r-good" data-r="good">앎</button>'
        + '</div>';
      el.querySelectorAll(".rate button").forEach(function(b){
        b.addEventListener("click", function(){ rate(b.getAttribute("data-r")); });
      });
    }
  }
  function rate(r){
    if (!current) return;
    reviewedToday++;
    if (r === "good"){
      current.level = Math.min(current.level + 1, INTERVALS.length - 1);
      current.due = now() + INTERVALS[current.level]*DAY;
      session.shift();
    } else if (r === "hard"){
      // 레벨 유지, 짧게 다시
      current.due = now() + Math.max(1, Math.round(INTERVALS[current.level]/2))*DAY;
      session.shift();
    } else { // again
      current.level = Math.max(0, current.level - 2);
      current.due = now(); // 여전히 due
      session.shift();
      session.push(current.id); // 이번 세션에서 다시 보여줌
    }
    save();
    nextCard();
  }

  /* ---------- 목록 ---------- */
  function renderList(){
    var el = document.getElementById("listCard");
    if (cards.length === 0){
      el.innerHTML = '<div class="empty">아직 단어가 없어요.</div>';
      return;
    }
    var sorted = cards.slice().sort(function(a,b){ return b.created - a.created; });
    var html = "";
    sorted.forEach(function(c){
      html += '<div class="row"><div>'
        + '<div class="en">' + esc(c.en) + '</div>'
        + '<div class="kr">' + esc(c.kr) + '</div>'
        + (c.ctx ? '<div class="ex">' + esc(c.ctx) + '</div>' : '')
        + '</div><button class="del" data-id="' + c.id + '">삭제</button></div>';
    });
    el.innerHTML = html;
    el.querySelectorAll(".del").forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-id");
        if (!confirm("이 단어를 삭제할까요?")) return;
        cards = cards.filter(function(c){ return c.id !== id; });
        save(); renderList();
      });
    });
  }

  /* ---------- 백업 ---------- */
  document.getElementById("exportBtn").addEventListener("click", function(){
    var data = JSON.stringify(cards, null, 2);
    var blob = new Blob([data], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
    a.href = url; a.download = "내단어장_" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var incoming = JSON.parse(ev.target.result);
        if (!Array.isArray(incoming)) throw new Error("형식 오류");
        var existing = {};
        cards.forEach(function(c){ existing[(c.en+"|"+c.kr).toLowerCase()] = true; });
        var added = 0;
        incoming.forEach(function(c){
          if (!c.en || !c.kr) return;
          var k = (c.en+"|"+c.kr).toLowerCase();
          if (existing[k]) return;
          existing[k] = true;
          cards.push({ id: c.id || uid(), en:c.en, kr:c.kr, ctx:c.ctx||"",
            level:c.level||0, due:c.due||now(), created:c.created||now() });
          added++;
        });
        save();
        alert(added + "개 단어를 불러왔습니다.");
      } catch(err){ alert("불러오기 실패: 올바른 백업 파일이 아닙니다."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ---------- util ---------- */
  function esc(s){ return (s||"").replace(/[&<>]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];}); }
  function pad(n){ return n<10 ? "0"+n : ""+n; }

  refreshCounts();
  startReview();
})();
</script>
</body>
</html>
